<!doctype html>
<!-- Sample sponsor creative, rendered deterministically to frames by
     render.mjs. Every frame is a function of t, so the output is
     identical on any machine and the text is pixel-exact — which is the
     whole reason this is not generated by a text-to-video model. -->
<html lang="en">
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: radial-gradient(120% 120% at 20% 10%, #15325c 0%, #0a1326 55%, #060a15 100%);
    font-family: "DejaVu Sans", sans-serif; color: #eef2fb;
    display: grid; place-items: center;
  }
  .stage { position: relative; width: 1280px; height: 720px; }
  .layer { position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center; opacity: 0; }

  /* subtle depth, nothing that competes with the words */
  .glow { position: absolute; width: 900px; height: 900px; left: 190px; top: -260px;
    border-radius: 50%; opacity: .5;
    background: radial-gradient(circle, rgba(94,160,255,.22) 0%, rgba(94,160,255,0) 62%); }

  .co { font-size: 46px; letter-spacing: .20em; font-weight: 700; color: #cfe0ff; }
  .co small { display: block; margin-top: 16px; font-size: 19px; letter-spacing: .34em;
    font-weight: 400; color: #7d93bd; }

  .brand { font-size: 112px; font-weight: 700; letter-spacing: .01em;
    background: linear-gradient(95deg, #ffffff 10%, #9ec9ff 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .dose { margin-top: 10px; font-size: 40px; font-weight: 700; color: #7fd4c4; letter-spacing: .05em; }
  .ind  { margin-top: 26px; font-size: 27px; color: #b9c6e2; letter-spacing: .015em; }

  .rule { width: 0; height: 2px; margin: 34px auto 0;
    background: linear-gradient(90deg, transparent, #5ea0ff, transparent); }

  .foot { position: absolute; left: 0; right: 0; bottom: 42px; font-size: 17px;
    color: #7688ad; letter-spacing: .05em; }
  .pi { position: absolute; left: 0; right: 0; bottom: 18px; font-size: 13.5px;
    color: #5d6c8c; letter-spacing: .03em; }
  /* Says what it is, so a sample can never be mistaken for a live
     approved campaign in a screenshot or a report. */
  .sample { position: absolute; top: 20px; right: 26px; font-size: 12px;
    letter-spacing: .22em; color: #4d5c7a; border: 1px solid #253552;
    padding: 5px 11px; border-radius: 999px; }
</style>

<div class="stage">
  <div class="glow" id="glow"></div>

  <div class="layer" id="l1">
    <div>
      <div class="co">ABC PHARMACEUTICALS<small>SRI LANKA</small></div>
    </div>
  </div>

  <div class="layer" id="l2">
    <div>
      <div class="brand" id="brand">FEROCIA</div>
      <div class="dose">200&nbsp;mg&nbsp;&nbsp;tablet</div>
      <div class="rule" id="rule"></div>
      <div class="ind">Iron supplementation in pregnancy</div>
    </div>
  </div>

  <div class="layer" id="l3">
    <div>
      <div class="co" style="font-size:34px">ABC PHARMACEUTICALS</div>
      <div class="ind" style="margin-top:18px">Ferocia 200&nbsp;mg tablet</div>
    </div>
  </div>

  <div class="foot" id="foot">Prescribing information available on request</div>
  <div class="pi">For healthcare professionals. Advertisement.</div>
  <div class="sample">SAMPLE CREATIVE</div>
</div>

<script>
/* One function of t, so every frame is reproducible and the recorder
   just steps it. No requestAnimationFrame, no wall clock. */
const lerp = (a, b, u) => a + (b - a) * u;
const clamp01 = u => u < 0 ? 0 : u > 1 ? 1 : u;
/* ease-out: movement that settles rather than stops dead */
const ease = u => 1 - Math.pow(1 - clamp01(u), 3);
/* fade in, hold, fade out */
function band(t, inAt, holdFor, fade) {
  const up = ease((t - inAt) / fade);
  const down = 1 - clamp01((t - (inAt + fade + holdFor)) / fade);
  return Math.max(0, Math.min(up, down));
}

window.setFrame = function (t) {
  const l1 = band(t, 0.10, 0.75, 0.45);
  const l2 = band(t, 1.55, 1.70, 0.45);
  const l3 = band(t, 3.95, 0.70, 0.40);

  document.getElementById('l1').style.opacity = l1;
  document.getElementById('l2').style.opacity = l2;
  document.getElementById('l3').style.opacity = l3;

  /* each block rises a little as it arrives */
  document.getElementById('l1').style.transform = `translateY(${lerp(16, 0, ease((t - 0.10) / 0.6))}px)`;
  document.getElementById('l2').style.transform = `translateY(${lerp(20, 0, ease((t - 1.55) / 0.7))}px)`;
  document.getElementById('l3').style.transform = `translateY(${lerp(14, 0, ease((t - 3.95) / 0.5))}px)`;

  /* the rule draws itself under the brand */
  document.getElementById('rule').style.width = `${lerp(0, 420, ease((t - 2.05) / 0.8))}px`;

  /* the glow drifts, so the frame is never completely static */
  document.getElementById('glow').style.transform =
    `translate(${lerp(-40, 40, clamp01(t / 5))}px, ${lerp(0, 30, clamp01(t / 5))}px)`;

  /* the footer is there from the moment there is a product on screen */
  document.getElementById('foot').style.opacity = band(t, 1.70, 2.6, 0.4) * 0.95;
};
window.setFrame(0);
</script>
</html>
